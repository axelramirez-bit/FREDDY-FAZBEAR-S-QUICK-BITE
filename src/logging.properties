# ===============================================================
# Configuración opcional de java.util.logging.
# ---------------------------------------------------------------
# Para activarla, agregar al arrancar la app (main.java o VM options
# de NetBeans):
#   -Djava.util.logging.config.file=logging.properties
#
# Sin esto, los logs igual funcionan: van a la consola (System.err),
# solo que con fecha/hora y sin tener que decidirlo por archivo.
# ===============================================================

handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

.level = INFO

java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.pattern = logs/freddyquickbite_%u.log
java.util.logging.FileHandler.limit = 5000000
java.util.logging.FileHandler.count = 3
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

java.util.logging.SimpleFormatter.format = %1$tF %1$tT [%4$s] %2$s: %5$s%6$s%n
